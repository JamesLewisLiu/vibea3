[package]
name = "vibea3-server"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "vibea3-server"
path = "main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "tokio"] }
dotenvy = "0.15.7"
vibea3 = { path = "../modules/core" }
maxminddb = "0.30.0"
mongodb = "3.8.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
